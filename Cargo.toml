[workspace]
resolver = "2"
members = [
    "crates/ide-core",
    "crates/ide-config",
    "crates/ide-buffer",
    "crates/ide-fs",
    "crates/ide-syntax",
    "crates/ide-lsp",
    "crates/ide-git",
    "crates/ide-search",
    "crates/ide-term",
    "crates/ide-sessions",
    "crates/ide-agents",
    "crates/ide-dap",
    "crates/ide-db",
    "crates/ide-plugins",
    "crates/ide-nvim",
    "crates/ide-ui",
    "crates/ide-app",
]
default-members = ["crates/ide-app"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
authors = ["tui-ide contributors"]
rust-version = "1.75"

[workspace.dependencies]
ide-core = { path = "crates/ide-core" }
ide-config = { path = "crates/ide-config" }
ide-buffer = { path = "crates/ide-buffer" }
ide-fs = { path = "crates/ide-fs" }
ide-syntax = { path = "crates/ide-syntax" }
ide-lsp = { path = "crates/ide-lsp" }
ide-git = { path = "crates/ide-git" }
ide-search = { path = "crates/ide-search" }
ide-term = { path = "crates/ide-term" }
ide-sessions = { path = "crates/ide-sessions" }
ide-agents = { path = "crates/ide-agents" }
ide-dap = { path = "crates/ide-dap" }
ide-db = { path = "crates/ide-db" }
ide-plugins = { path = "crates/ide-plugins" }
ide-nvim = { path = "crates/ide-nvim" }
ide-ui = { path = "crates/ide-ui" }

nvim-rs = { version = "0.9", features = ["use_tokio"] }
rmpv = "1.3"
async-trait = "0.1"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "io-std"] }
tokio-util = { version = "0.7", features = ["codec"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ropey = "1.6"
ignore = "0.4"
notify = "7"
nucleo-matcher = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
lsp-types = "0.97"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-md = "0.3"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
bytes = "1"
dashmap = "6"
dirs = "6"
walkdir = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
portable-pty = "0.8"
regex = "1"
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "mysql", "chrono", "uuid", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls", "tds73", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
duckdb = { version = "1.1", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp"] }
mongodb = "3.1"
arboard = "3"
